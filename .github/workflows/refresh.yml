# Safety net: rebuilds the site once a day (and on demand) so it never drifts
# far from the vault, even if the vault-side workflow is missing or fails.
#
# Needs a repo secret DEPLOY_HOOK (a build hook URL from Netlify or Vercel).
name: Refresh from vault

on:
  schedule:
    - cron: "17 11 * * *" # daily, ~6-7am New York
  workflow_dispatch:
  repository_dispatch:
    types: [vault-updated]

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Check the build still works
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci || npm install
      - run: npm run build
      - name: Trigger deploy
        env:
          HOOK: ${{ secrets.DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "DEPLOY_HOOK not set; skipping deploy"; exit 0; fi
          curl -fsS -X POST "$HOOK"
